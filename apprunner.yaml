version: 1.0

# AWS App Runner configuration file for hn-today-api

runtime: nodejs22

run:
  command: npm start

environment:
  NODE_ENV: production
  # MONGO_DB_URL: <set-in-aws-console-or-here>
  # PORT: 3000

healthCheck:
  path: /
  interval: 10
  timeout: 5
  healthyThreshold: 1
  unhealthyThreshold: 5

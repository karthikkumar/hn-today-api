version: 1.0

# AWS App Runner configuration file for hn-today-api

runtime: nodejs22

# The command to start your application
startCommand: npm start

# Environment variables (override or add more in AWS console as needed)
environment:
  NODE_ENV: production
  # MONGO_DB_URL: <set-in-aws-console-or-here>
  # PORT: 3000

# Health check configuration
healthCheck:
  path: /
  interval: 10
  timeout: 5
  healthyThreshold: 1
  unhealthyThreshold: 5
